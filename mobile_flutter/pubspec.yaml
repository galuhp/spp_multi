name: espp_mobile
description: Aplikasi mobile E-SPP Sekolah (Android & iOS) untuk siswa/orang tua.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  dio: ^5.7.0
  go_router: ^14.2.0
  flutter_secure_storage: ^9.2.2
  intl: ^0.20.3
  qr_flutter: ^4.1.0
  share_plus: ^10.0.0
  shimmer: ^3.0.0
  google_fonts: ^6.2.1
  shadcn_ui: ^0.59.0
  pdf: ^3.13.1
  printing: ^5.15.1
  local_auth: ^3.0.2
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/branding/app_icon.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#1E3A8A"
  image: "assets/branding/splash_logo.png"
  color_dark: "#0B1020"
  android: true
  ios: true
  fullscreen: true

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
  fonts:
    - family: IBMPlexSans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Variable.ttf
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
        - asset: assets/fonts/IBMPlexMono-SemiBold.ttf
          weight: 600
