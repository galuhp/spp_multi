name: espp_mobile
description: Aplikasi mobile E-SPP Sekolah (Android & iOS) untuk siswa/orang tua.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  dio: ^5.7.0
  go_router: ^14.2.0
  flutter_secure_storage: ^9.2.2
  intl: ^0.20.3
  qr_flutter: ^4.1.0
  share_plus: ^10.0.0
  shimmer: ^3.0.0
  google_fonts: ^6.2.1
  shadcn_ui: ^0.59.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
